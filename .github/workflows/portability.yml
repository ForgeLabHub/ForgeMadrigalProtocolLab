name: Portability

# Дополняет ci.yml: проверяет не корректность модулей, а переносимость поставки —
# собирается ли артефакт, устанавливается ли он в чистое окружение и запускается ли,
# а также полна ли документация и куда ведут ссылки.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Wheel builds and installs into a clean environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist
          ls -la dist

      - name: Install the wheel into a clean virtual environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install dist/*.whl
          # Установка обязана тянуть только базовые зависимости, без web/dev.
          /tmp/clean/bin/python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("src.capture"), "пакет не установлен"
          assert importlib.util.find_spec("PySide6"), "PySide6 должен ставиться как runtime"
          assert not importlib.util.find_spec("fastapi"), "web-стек не должен ставиться по умолчанию"
          print("базовые зависимости корректны")
          PY

      - name: The packaged entry point starts headless
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0
          QT_QPA_PLATFORM=offscreen /tmp/clean/bin/madrigal-lab --help

      - name: The package runs the protocol engine on the bundled corpus
        run: |
          /tmp/clean/bin/python - <<'PY'
          from src.protocol import *  # noqa: F401,F403 - проверяем импорт пакета
          print("движок импортируется в чистом окружении")
          PY

  docs:
    name: Documentation is complete and linked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural checks
        run: ./scripts/docs-check.sh
      - name: Both language sets exist and overlap
        # Наборы не совпадают один-в-один и не должны: русский набор исторически
        # содержит CHANGELOG/CONTRIBUTING/PROGRESS, английский — BEYOND_SCOPE и
        # PROJECT_MAP. Проверяем то, что важно: оба набора живые и в основном
        # описывают одни и те же темы, а не разошлись в разные документы.
        run: |
          python - <<'PY'
          import pathlib, sys
          en = {p.name for p in pathlib.Path("docs").glob("*.md")}
          ru = {p.name for p in pathlib.Path("docs/ru").glob("*.md")}
          print(f"en={len(en)} ru={len(ru)} общих={len(en & ru)}")
          problems = []
          if len(en) < 30 or len(ru) < 30:
              problems.append("набор слишком мал — часть документации потеряна")
          if not en & ru or len(en & ru) / max(len(en), len(ru)) < 0.75:
              problems.append("наборы разошлись: общих документов меньше 75%")
          for required in ("docs/index.md", "docs/ru/README.md", "docs/PROJECT_MAP.md"):
              if not pathlib.Path(required).exists():
                  problems.append(f"нет {required}")
          if problems:
              print("\n".join(problems), file=sys.stderr)
              sys.exit(1)
          print("оба набора на месте")
          PY

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Protocol laboratory{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Protocol lab</a>
    {% if capture_id %}<span class="chip" title="{{ source_file }}">{{ capture_id[:19] }}</span>{% endif %}
    {% if has_rule %}<span class="chip chip--accent">rule {{ rule_id }} v{{ rule_version }}</span>{% else %}<span class="chip" title="Every byte is uncovered until a rule is loaded">no rule</span>{% endif %}
    <span class="spacer"></span>
    {% if capture_id %}<a class="button" href="/rule" title="Edit, upload or load a rule for this capture">Rule</a>{% endif %}
    <a class="button" href="/open-capture" title="Upload a capture (normalized JSON or raw pcap/pcapng)">Open capture</a>
    {% if capture_id %}<a class="button" href="/export/report" title="Download the interpretation of every session as a self-contained HTML page">Export report (HTML)</a>{% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
